services:
  postgres:
    image: postgres:16
    container_name: sports_fixtures_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_fixtures
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_fixtures"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
